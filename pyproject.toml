[tool.pytest.ini_options]
# Tests live alongside each pipeline (pipelines/<engine>/tests/) plus any
# top-level test_* files; pytest discovers them automatically when run
# from the repo root.
testpaths = ["pipelines"]
python_files = ["test_*.py"]
addopts = "-q --tb=short"

# Suppress warnings from py65 (used by extraction engine_model).
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# Imports use the `pipelines.<engine>.extract.<module>` form. Repo root
# must be on sys.path so those imports resolve. Pytest adds the rootdir
# automatically when it finds conftest.py or pyproject.toml at the root.

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
strict_optional = true
# Per-pipeline strict typing where the dataclass refactor has landed.
[[tool.mypy.overrides]]
module = "pipelines.commando.extract.*"
disallow_untyped_defs = true
[[tool.mypy.overrides]]
module = "pipelines.monty.extract.*"
disallow_untyped_defs = true
# The cloned decompile.py (= src/rh_decompile.py) is legacy untyped code.
[[tool.mypy.overrides]]
module = "pipelines.commando.extract.decompile"
ignore_errors = true
[[tool.mypy.overrides]]
module = "pipelines.monty.extract.decompile"
ignore_errors = true
